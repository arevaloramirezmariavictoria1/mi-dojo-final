<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cuadrados Anidados</title>
    <link rel="stylesheet" href="style-basic.css" />
  </head>

  <body>
    <h1>Ejercicio de Cuadrados anidados.</h1>
    <section class="cuadros">
      <div class="cuadrado azul">
        <h2 class="titulo-azul">Cuadro azul</h2>
        <div class="cuadrado verde">
          <h3>Cuadrado verde</h3>
          <div class="cuadrado morado">
            <h4>Cuadrado morado</h4>
            <div class="cuadrado rosa">
              <h5>Cuadrado rosa</h5>
            </div>
          </div>
        </div>
      </div>

      <div class="cuadrado azul">
        <div class="cuadrado verde">
          <div class="cuadrado morado">
            <div class="cuadrado rosa"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="cuadros-dos">
      <div class="cuadrado azul-small">
        <div class="cuadrado verde-small">
          <div class="cuadrado morado-small">
            <div class="cuadrado rosa-small"></div>
          </div>
        </div>
      </div>

      <div class="cuadrado azul-small">
        <div class="cuadrado verde-small">
          <div class="cuadrado morado-small">
            <div class="cuadrado rosa-small"></div>
          </div>
        </div>
      </div>

      <div class="cuadrado azul-small">
        <div class="cuadrado verde-small">
          <div class="cuadrado morado-small">
            <div class="cuadrado rosa-small"></div>
          </div>
        </div>
      </div>
    </section>
  </body>
</html>
